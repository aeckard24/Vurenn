name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-check published vulnerability data even when the code has not changed.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  python-security:
    name: Bandit and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: Scan Python source with Bandit
        # Exclude virtual environments and generated/build directories.
        run: bandit --recursive . --exclude .git,.venv,venv,build,dist --severity-level medium --confidence-level medium
      - name: Audit pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find . -type f \( -name 'requirements*.txt' -o -name 'pyproject.toml' \) -not -path './.git/*')
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Python dependency manifest found; skipping pip-audit."
            echo "Add requirements.txt or pyproject.toml to enable CVE auditing."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            echo "Auditing $manifest"
            if [[ "$manifest" == *.toml ]]; then
              pip-audit --project "$manifest"
            else
              pip-audit --requirement "$manifest"
            fi
          done
